[project]
name = "workday-tools"
description = "Browser-driven Workday tooling with API-based Google Calendar sync."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Antoni Segura Puimedon" }]
keywords = ["workday", "google-calendar", "playwright", "absence", "sync"]
dynamic = ["version"]
dependencies = [
    "playwright>=1.47",
    "google-api-python-client>=2.140",
    "google-auth>=2.33",
    "google-auth-oauthlib>=1.2",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Linux desktop tray: PyGObject lets pystray use the AppIndicator backend, whose
# menu works under GNOME/Wayland (the X11 fallback's menu does not). Kept optional
# so macOS and headless/CLI-only installs don't build it; needs system libraries
# too (see the README's Linux notes). The marker no-ops it off Linux.
tray-linux = ["pygobject>=3.50; sys_platform == 'linux'"]

[project.urls]
Homepage = "https://github.com/celebdor/workday-tools"
Repository = "https://github.com/celebdor/workday-tools"

[project.scripts]
wdtools = "wdtools.__main__:main"
# Convenience wrapper so `uv tool install` users (who only get *our* entry
# points, not Playwright's own CLI) can fetch Chromium in one step.
wdtools-playwright-install = "wdtools.browsers:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wdtools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wdtools"]
